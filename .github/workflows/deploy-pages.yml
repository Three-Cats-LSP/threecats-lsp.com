name: Publish static site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-publish
  # Queue publishes instead of canceling them. Manual app/site reruns often
  # happen close together, and canceling mid-publish leaves confusing red
  # Actions even when the generated site is otherwise valid.
  cancel-in-progress: false

jobs:
  publish:
    # App-sync commits publish the site in the sync workflow itself, avoiding
    # a second hosted-runner queue. Ordinary site edits still publish here.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip site-publish]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public app mirror links
        run: python3 scripts/verify-cross-app-links.py

      - name: Build clean Pages artifact
        run: python3 scripts/build-pages-artifact.py --out _site

      - name: Publish artifact branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach _deploy HEAD
          git -C _deploy switch --orphan gh-pages-publish
          git -C _deploy rm -r --quiet . 2>/dev/null || true
          cp -a _site/. _deploy/
          git -C _deploy add -A
          git -C _deploy commit -m "Publish static site artifact"
          git -C _deploy push --force origin HEAD:gh-pages
