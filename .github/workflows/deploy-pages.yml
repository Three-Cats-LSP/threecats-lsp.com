name: Publish static site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public app mirror links
        run: python3 scripts/verify-cross-app-links.py

      - name: Build clean Pages artifact
        run: python3 scripts/build-pages-artifact.py --out _site

      - name: Publish artifact branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach _deploy origin/gh-pages
          git -C _deploy rm -r --quiet .
          cp -a _site/. _deploy/
          git -C _deploy add -A
          if git -C _deploy diff --cached --quiet; then
            echo "No gh-pages changes to publish"
          else
            git -C _deploy commit -m "Publish static site artifact"
            git -C _deploy push origin HEAD:gh-pages
          fi
